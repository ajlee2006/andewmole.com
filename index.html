<title>Andrew Lee (AndewMole)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=EB+Garamond:wght@500;600;700&family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" href="andewmole.png" type="image/png">
  
<style>
  :root {
    --bg: #0e0d0c;
    --bg-warm: #16130f;
    --ink: #f4ede0;
    --ink-soft: #d6cdbb;
    --ink-faint: #8a8068;
    --accent: #c9a45c;
    --rule: rgba(244, 237, 224, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(201, 164, 92, 0.08), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(201, 164, 92, 0.04), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: 'Inter Tight', -apple-system, sans-serif;
    font-weight: 300;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: clamp(2rem, 6vw, 4rem) clamp(1.25rem, 5vw, 3rem);
    position: relative;
    overflow-x: hidden;
  }

  /* Subtle grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3CfeColorMatrix values='0 0 0 0 0.95 0 0 0 0 0.93 0 0 0 0 0.88 0 0 0 0.4 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    opacity: 0.06;
    z-index: 1;
    mix-blend-mode: overlay;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    max-width: 720px;
    width: 100%;
    position: relative;
    z-index: 2;
    animation: fadeUp 1.2s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 {
    font-family: 'EB Garamond', Georgia, serif;
    font-weight: 500;
    font-size: clamp(3rem, 11vw, 6.5rem);
    line-height: 1;
    letter-spacing: 0.01em;
    color: var(--ink);
    margin-bottom: 1.25rem;
    animation: fadeUp 1.2s 0.2s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }

  .roles {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(1.1rem, 3.5vw, 1.5rem);
    color: var(--accent);
    margin-bottom: 0.4rem;
    letter-spacing: 0.01em;
    animation: fadeUp 1.2s 0.3s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }

  .subrole {
    font-family: 'Inter Tight', sans-serif;
    font-weight: 400;
    font-size: 0.85rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 3rem;
    animation: fadeUp 1.2s 0.4s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }

  .divider {
    width: 1px;
    height: 3rem;
    background: transparent;
    margin: 0 auto 2.5rem;
    animation: fadeUp 1.2s 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }

  .body-text {
    font-family: 'Inter Tight', sans-serif;
    font-weight: 300;
    font-size: clamp(0.95rem, 2.4vw, 1.05rem);
    color: var(--ink-soft);
    margin-bottom: 0.9rem;
    animation: fadeUp 1.2s 0.6s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }

  .body-text:last-of-type {
    margin-bottom: 0;
    animation-delay: 0.7s;
  }

  .body-text a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--accent);
    padding-bottom: 1px;
    transition: color 0.3s ease, border-color 0.3s ease;
  }

  .body-text a:hover {
    color: var(--accent);
    border-color: var(--ink);
  }

  /* Footer / socials */
  footer {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    padding-top: 3rem;
    position: relative;
    z-index: 2;
    animation: fadeUp 1.2s 0.8s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }

  .socials {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: clamp(1.25rem, 4vw, 2rem);
  }

  .socials a {
    color: var(--ink-faint);
    transition: color 0.25s ease, transform 0.25s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.25rem;
    height: 2.25rem;
  }

  .socials a:hover {
    color: var(--accent);
    transform: translateY(-2px);
  }

  .socials svg {
    width: 1.25rem;
    height: 1.25rem;
    fill: currentColor;
  }

  @media (max-width: 540px) {
    .socials {
      gap: 1.1rem;
    }

    .socials a {
      width: 2rem;
      height: 2rem;
    }
  }

  /* Respect reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-delay: 0ms !important;
    }
  }
</style>
</head>

  <h1>Andrew Lee</h1>

  <div class="roles">French horn &middot; piano</div>
  <div class="subrole">Performer &amp; arranger</div>

  <div class="divider"></div>

  <p class="body-text">Website coming soon!</p>
  <p class="body-text">In the meantime, check out my web projects at <a href="https://apps.andewmole.com">apps.andewmole.com</a>.</p>
